<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taur Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/taur_app.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
</head>

<body class="taur-page">
    <div class="taur-container">
        <div class="taur-left-column">
            <div class="taur-canvas-container">
                <canvas id="taur-canvas"></canvas>
            </div>
        </div>
        <div class="taur-right-column">
            <div class="taur-header">
                <h1>Taur Calculator</h1>
                <p>By Vixi, <a href="https://www.f-list.net/c/Volnar" style="color: #78d0ff;">Volnar</a> and <a href="https://www.furaffinity.net/user/snownight" style="color: #78d0ff;">Snow</a>! With art by <a href="https://hunner.carrd.co/" style="color: #78d0ff;">Hunner</a>!</p>
            </div>




            <!-- Results filled client-side by taur_form.js -->
            <div class="taur-results" id="taur-results" hidden>
                <h2>Calculation Results</h2>
                <div class="results-box">
                    <table>
                        <tbody id="taur-results-body"></tbody>
                    </table>
                </div>
            </div>

            <form class="taur-form" id="taur-form">
                <div class="taur-form-group">
                    <label for="algorithm">Algorithm:</label>
                    <select id="algorithm" name="algorithm">
                        <option value="volnar" selected>Volnar</option>
                        <option value="manual">Manual</option>
                    </select>
                </div>

                <div class="taur-form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" placeholder="Character name" />
                </div>

                <div id="volnar-inputs" class="taur-algorithm-panel">
                <div class="taur-form-group">
                    <label for="measurement_type">Measurement Type: <span class="info-icon"
                            title="Vitruvian: Default for mammals, the body height and upper limbs are scaled such that you can reach your own tail when bending over backwards. 
                            Limb: For lizards/dragons and others where body length may not be symmetrical. Will use species length directly">ℹ️</span></label>
                    <select id="measurement_type" name="measurement_type">
                        <option value="vitruvian">Vitruvian (for mammals)</option>
                        <option value="limb">Limb (for lizards/dragons and all else)</option>
                    </select>
                </div>

                <div class="taur-form-group">
                    <label for="species">Species:</label>
                    <select id="species" name="species">
                        {% for specie in species %}
                        <option value="{{ specie }}">{{ specie.replace('_', ' ').title() }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="taur-form-group taur-half">
                    <label for="anthro_height">Anthro Height (AH): <span class="info-icon"
                            title="Your anthro height before taurification, measured in inches">ℹ️</span></label>
                    <input type="number" step="0.1" id="anthro_height" name="anthro_height" placeholder="e.g., 76" />
                </div>

                <div class="taur-form-group taur-half">
                    <label for="species_height">Species Height (SH): <span class="info-icon"
                            title="Your species's feral height, measured in inches">ℹ️</span></label>
                    <input type="number" step="0.1" id="species_height" name="species_height" placeholder="e.g., 36" />
                </div>

                <div class="taur-form-group taur-half">
                    <label for="species_length">Species Length w/o Tail (SL): <span class="info-icon"
                            title="Your species's body length from nose to base of tail, measured in inches">ℹ️</span></label>
                    <input type="number" step="0.1" id="species_length" name="species_length" placeholder="e.g., 48" />
                </div>

                <div class="taur-form-group taur-half">
                    <label for="species_tail_length">Species Tail Length (ST): <span class="info-icon"
                            title="Your species's tail length, measured in inches">ℹ️</span></label>
                    <input type="number" step="0.1" id="species_tail_length" name="species_tail_length"
                        placeholder="e.g., 24" />
                </div>

                <div class="taur-form-group taur-half">
                    <label for="taur_full_height">Taur Full Height (TFH): <span class="info-icon"
                            title="Your desired final taur height (from pawpads to top of head not including horns, ears or antlers), measured in inches">ℹ️</span></label>
                    <input type="number" step="0.1" id="taur_full_height" name="taur_full_height"
                        placeholder="e.g., 108" />
                </div>

                <div class="taur-form-group taur-half">
                    <label for="species_weight">Species Weight (SW): <span class="info-icon"
                            title="Your species's weight, measured in pounds (NOT YOUR OC'S WEIGHT!)">ℹ️</span></label>
                    <input type="number" step="0.1" id="species_weight" name="species_weight" placeholder="e.g., 150" />
                </div>

                <div class="taur-form-group">
                    <label for="taur_length">Taur Length w/o Tail (TL) - Optional: <span class="info-icon"
                            title="The body length of the taur (from front to base of tail). Leave empty to auto-calculate">ℹ️</span></label>
                    <input type="number" step="0.1" id="taur_length" name="taur_length"
                        placeholder="Leave empty for auto" />
                </div>
                </div>

                <div id="manual-inputs" class="taur-algorithm-panel" hidden>
                    <p class="taur-manual-hint">Set each major dimension in inches to tune measurement lines and scaling.</p>

                    <div class="taur-form-group taur-half">
                        <label for="manual_tfh">TFH (full height):</label>
                        <input type="number" step="0.1" id="manual_tfh" name="manual_tfh" placeholder="e.g., 108" />
                    </div>

                    <div class="taur-form-group taur-half">
                        <label for="manual_th">TH (leg height):</label>
                        <input type="number" step="0.1" id="manual_th" name="manual_th" placeholder="e.g., 54" />
                    </div>

                    <div class="taur-form-group taur-half">
                        <label for="manual_the">THe (head):</label>
                        <input type="number" step="0.1" id="manual_the" name="manual_the" placeholder="e.g., 14" />
                    </div>

                    <div class="taur-form-group taur-half">
                        <label for="manual_tto">TTo (torso):</label>
                        <input type="number" step="0.1" id="manual_tto" name="manual_tto" placeholder="e.g., 40" />
                    </div>

                    <div class="taur-form-group taur-half">
                        <label for="manual_tl">TL (body length):</label>
                        <input type="number" step="0.1" id="manual_tl" name="manual_tl" placeholder="e.g., 72" />
                    </div>

                    <div class="taur-form-group taur-half">
                        <label for="manual_tt">TT (tail):</label>
                        <input type="number" step="0.1" id="manual_tt" name="manual_tt" placeholder="e.g., 36" />
                    </div>
                </div>

                <div class="taur-form-group">
                    <label for="taur_body_color">Body Color (lower, upper, tail):</label>
                    <input type="color" id="taur_body_color" name="taur_body_color" value="#ff0000" />
                </div>

                <div class="taur-form-group taur-rider-toggle">
                    <label for="show_measurements">
                        <input type="checkbox" id="show_measurements" name="show_measurements" value="1"
                            {% if debug %}checked{% endif %} />
                        Show measurement lines
                    </label>
                </div>

                <div class="taur-form-group taur-rider-toggle">
                    <label for="show_rider">
                        <input type="checkbox" id="show_rider" name="show_rider" value="1" />
                        Show Rider
                    </label>
                </div>

                <div class="taur-form-group taur-rider-height" id="rider-height-group" hidden>
                    <label for="rider_height">Rider Height: <span class="info-icon"
                            title="The rider's height in inches">ℹ️</span></label>
                    <input type="number" step="0.1" id="rider_height" name="rider_height" placeholder="e.g., 76" />
                </div>

                <div class="taur-form-group taur-rider-color" id="rider-color-group" hidden>
                    <label for="taur_rider_color">Rider Color:</label>
                    <input type="color" id="taur_rider_color" name="taur_rider_color" value="#ff8800" />
                </div>

                <button type="button" id="taur-share-btn">Share</button>
                <div class="taur-share" id="taur-share" hidden>
                    <input type="text" id="taur-share-url" readonly aria-label="Shareable link" />
                    <button type="button" id="taur-share-copy">Copy</button>
                </div>
            </form>
            <div class="back-link-container">
                <a href="/" class="back-link">&larr; Back to Main Calculator</a>
            </div>
        </div>
    </div>

    <script>
        window.taurCanvasConfig = {
            taurData: {{ taur_data | tojson | safe }},
            layerSources: {{ taur_layer_urls | tojson | safe }},
            debug: {{ debug | tojson }},
        };
        window.taurFormConfig = {
            speciesData: {{ species_data | tojson | safe }},
        };
    </script>
    <script src="{{ url_for('static', filename='js/size_diff/units.js') }}"></script>
    <script src="{{ url_for('static', filename='js/size_diff/compositor.js') }}"></script>
    <script src="{{ url_for('taur_calculator_asset', filename='taur_algorithms.js') }}"></script>
    <script src="{{ url_for('taur_calculator_asset', filename='taur_measurements.js') }}"></script>
    <script src="{{ url_for('taur_calculator_asset', filename='taur_canvas.js') }}"></script>
    <script src="{{ url_for('taur_calculator_asset', filename='taur_form.js') }}"></script>
</body>

</html>
